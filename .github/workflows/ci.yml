name: RoofToGrid CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build & Typecheck (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: https://rooftogrid.in
          NEXT_PUBLIC_API_URL: https://api.rooftogrid.in/api/v1
          NEXT_PUBLIC_UPI_ID: 9834961796@upi
        run: npm run build

  backend:
    name: Backend Build & Test (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Backend Unit Tests
        working-directory: backend
        run: npm run test:unit

  backend-go:
    name: Backend Build & Test (Go Native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend-go/go.sum

      - name: Run Go Unit Tests
        working-directory: backend-go
        run: go test -v ./...

      - name: Build Go Static Binary
        working-directory: backend-go
        run: go build -o bin/server cmd/server/main.go

  frontend-svelte:
    name: Frontend Build (SvelteKit 5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-svelte/package-lock.json

      - name: Install dependencies
        working-directory: frontend-svelte
        run: npm ci

      - name: Build SvelteKit Production Bundle
        working-directory: frontend-svelte
        run: npm run build
