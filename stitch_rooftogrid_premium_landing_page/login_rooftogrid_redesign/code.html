<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - RoofToGrid</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#231a08",
                        "on-tertiary-container": "#798877",
                        "surface": "#faf9f7",
                        "on-primary-fixed-variant": "#474746",
                        "inverse-on-surface": "#f1f1ef",
                        "primary-container": "#1c1b1b",
                        "secondary-container": "#efdec1",
                        "background": "#faf9f7",
                        "inverse-surface": "#2f3130",
                        "secondary-fixed": "#f1e0c3",
                        "tertiary-fixed": "#d7e7d4",
                        "outline-variant": "#c4c7c7",
                        "on-primary-fixed": "#1c1b1b",
                        "on-error-container": "#93000a",
                        "outline": "#747878",
                        "primary": "#000000",
                        "surface-container-high": "#e9e8e6",
                        "on-secondary-fixed-variant": "#504530",
                        "tertiary-fixed-dim": "#bbcbb8",
                        "surface-dim": "#dadad8",
                        "inverse-primary": "#c8c6c5",
                        "primary-fixed-dim": "#c8c6c5",
                        "error": "#ba1a1a",
                        "on-surface": "#1a1c1b",
                        "surface-bright": "#faf9f7",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e3e2e0",
                        "on-secondary": "#ffffff",
                        "on-background": "#1a1c1b",
                        "on-surface-variant": "#444748",
                        "surface-tint": "#5f5e5e",
                        "secondary-fixed-dim": "#d5c5a9",
                        "surface-container": "#efeeec",
                        "tertiary-container": "#121e13",
                        "on-secondary-container": "#6d614a",
                        "secondary": "#695d46",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#e5e2e1",
                        "on-error": "#ffffff",
                        "tertiary": "#000000",
                        "on-tertiary-fixed": "#121e13",
                        "surface-container-highest": "#e3e2e0",
                        "on-primary-container": "#858383",
                        "on-tertiary-fixed-variant": "#3d4a3c",
                        "surface-container-low": "#f4f3f1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-max-width": "1280px",
                        "unit": "8px",
                        "margin-desktop": "48px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "caption": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "caption": ["12px", { "lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-lg": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #faf9f7;
            background-image: radial-gradient(#e5e2e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 226, 221, 0.8);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
        }

        .input-subtle {
            background-color: #f2f0ed;
            border: none;
            border-bottom: 1px solid #c4c7c7;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-subtle:focus {
            outline: none;
            border-bottom-color: #000000;
            box-shadow: 0 1px 0 0 #000000;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<!-- Note: TopNavBar and Footer are suppressed for this transactional Login page as per the Shared Components Logic mandate. -->
<main class="w-full max-w-md mx-auto">
<!-- Brand Header for Context -->
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">RoofToGrid</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Sign in to your account</p>
</div>
<!-- Glassmorphism Login Card -->
<div class="glass-panel rounded-xl p-8 md:p-10">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant pl-2 pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="input-subtle block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-caption text-caption text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant hover:decoration-primary underline-offset-4" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant pl-2 pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="input-subtle block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center pt-2">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-caption text-caption text-on-surface-variant" for="remember-me">
                        Keep me signed in
                    </label>
</div>
<!-- Submit Action -->
<div class="pt-4">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded bg-primary text-on-primary font-label-md text-label-md hover:bg-inverse-surface hover:shadow-[0_4px_20px_rgba(0,0,0,0.1)] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-[#fdfdfc] font-caption text-caption text-outline">Or continue with</span>
</div>
</div>
<!-- SSO Options -->
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="flex justify-center items-center py-2 px-4 border border-outline-variant rounded bg-transparent font-caption text-caption text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined mr-2 text-on-surface-variant text-[18px]">business</span>
                        Company SSO
                    </button>
<button class="flex justify-center items-center py-2 px-4 border border-outline-variant rounded bg-transparent font-caption text-caption text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined mr-2 text-on-surface-variant text-[18px]">key</span>
                        Passkey
                    </button>
</div>
</div>
</div>
<!-- Footer link -->
<p class="mt-8 text-center font-caption text-caption text-on-surface-variant">
            Don't have an account? 
            <a class="font-label-md text-primary hover:underline underline-offset-4 decoration-primary/30 hover:decoration-primary transition-all" href="#">Request Access</a>
</p>
</main>
</body></html>
