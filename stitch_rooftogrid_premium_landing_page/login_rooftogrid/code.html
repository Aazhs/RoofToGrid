<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - RoofToGrid</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#060e20",
                        "tertiary": "#ffc08e",
                        "tertiary-fixed-dim": "#ffb77d",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container-high": "#222a3d",
                        "on-error": "#690005",
                        "on-surface-variant": "#d8c3ad",
                        "on-tertiary-fixed": "#2f1500",
                        "on-tertiary-container": "#6a3700",
                        "on-primary-fixed": "#2a1700",
                        "surface-bright": "#31394d",
                        "secondary": "#4edea3",
                        "on-secondary-fixed": "#002113",
                        "on-primary": "#472a00",
                        "tertiary-container": "#ff9837",
                        "primary-fixed-dim": "#ffb95f",
                        "inverse-on-surface": "#283044",

                        "inverse-surface": "#dae2fd",

                        "primary-container": "#f59e0b",

                        "on-background": "#dae2fd",
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "secondary-container": "#00a572",
                        "tertiary-fixed": "#ffdcc3",
                        "primary": "#ffc174",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#2d3449",
                        "error": "#ffb4ab",
                        "on-tertiary": "#4d2600",
                        "inverse-primary": "#855300",
                        "on-secondary": "#003824",
                        "on-primary-fixed-variant": "#653e00",
                        "on-primary-container": "#613b00",
                        "outline-variant": "#534434",
                        "outline": "#a08e7a",
                        "surface-container": "#171f33",
                        "surface": "#0b1326",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-fixed": "#ffddb8",
                        "on-tertiary-fixed-variant": "#6e3900"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "64px",
                        "gutter": "16px",
                        "base-unit": "8px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "stats-num": ["Plus Jakarta Sans"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],

                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "stats-num": ["32px", { "lineHeight": "1.0", "fontWeight": "700" }],

                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]

                }
            }
        }

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .input-dark {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: theme('colors.on-surface');
        }
        
        .input-dark:focus {
            border-color: theme('colors.primary-container');
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(180deg, theme('colors.primary-container') 0%, #D97706 100%);
            color: #0F172A;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
        }

        .glow-accent {
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Grid & Glows -->
<div class="absolute inset-0 bg-grid-pattern z-0 opacity-50"></div>
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container/10 rounded-full blur-[100px] z-0 pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-[100px] z-0 pointer-events-none"></div>
<!-- Login Container -->
<main class="w-full max-w-md px-4 sm:px-6 z-10 relative">
<!-- Logo/Brand Area -->
<div class="text-center mb-10">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter glow-accent inline-block p-2 rounded-xl">RoofToGrid</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Intelligent Grid Management</p>
</div>
<!-- Glassmorphism Card -->
<div class="glass-card rounded-xl p-8 shadow-2xl">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6">Welcome Back</h2>
<form action="#" class="space-y-6" method="POST">
<!-- Email/Phone Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="identifier">Email or Phone</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg">person</span>
</div>
<input class="input-dark w-full rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md placeholder:text-on-surface-variant/50" id="identifier" name="identifier" placeholder="Enter your email or phone number" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg">lock</span>
</div>
<input class="input-dark w-full rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-on-surface-variant text-lg hover:text-on-surface transition-colors">visibility_off</span>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-gray-700 bg-surface-container text-primary-container focus:ring-primary-container focus:ring-offset-background" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg btn-primary font-headline-md text-headline-md !text-[18px]" type="submit">
                        Sign In
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-6 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-high/50 backdrop-blur-md text-on-surface-variant font-label-caps text-label-caps rounded-full border border-outline-variant/30">Or continue with</span>
</div>
</div>
<!-- Social Login -->
<div class="mt-6">
<button class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-outline-variant/50 rounded-lg bg-surface-container/50 hover:bg-surface-container transition-colors text-on-surface font-body-md text-body-md" type="button">
<svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
</div>
</div>
<!-- Sign Up Link -->
<p class="mt-8 text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-bold text-primary hover:text-primary-fixed transition-colors underline-offset-4 hover:underline" href="#">Sign up</a>
</p>
</main>
</body></html>
