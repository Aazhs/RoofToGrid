<!-- 
      Note: TopNavBar and Footer components are intentionally suppressed per the 
      "Semantic Shell Mandate" which dictates automatic suppression for Linear/Transactional 
      pages like Login, Sign-up, and Onboarding to prioritize the focused user journey. 
    -->
<!-- Main Content Canvas -->
<main class="w-full max-w-[440px] px-margin-mobile z-10 relative">
<!-- Minimalist Brand Identifier -->
<div class="text-center mb-10 flex flex-col items-center">
<div class="h-12 w-12 bg-surface-container-low border border-outline-variant rounded-lg flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary-container text-2xl" data-icon="grid_view" style="font-variation-settings: 'FILL' 1;">grid_view</span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2 tracking-tight">RoofToGrid</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to your energy portfolio.</p>
</div>
<!-- Login Card (Raised Layer) -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-8 md:p-10 w-full shadow-[0_32px_64px_-16px_rgba(0,0,0,0.8)] relative overflow-hidden">
<!-- Subtle highlight line at top of card -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary-container/20 to-transparent"></div>
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest block" for="email">Email Address</label>
<div class="relative">
<input autocomplete="email" class="w-full bg-surface-container border border-outline-variant rounded-DEFAULT px-4 py-3.5 pl-11 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="admin@rooftogrid.com" required="" type="email"/>
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px]" data-icon="mail">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary-container transition-colors focus:outline-none" href="#">Forgot?</a>
</div>
<div class="relative">
<input autocomplete="current-password" class="w-full bg-surface-container border border-outline-variant rounded-DEFAULT px-4 py-3.5 pl-11 pr-11 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px]" data-icon="key">key</span>
<!-- Minimalist toggle visibility button -->
<button class="absolute right-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant/70 hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-fixed font-label-sm text-label-sm uppercase tracking-widest py-4 px-6 rounded-DEFAULT hover:bg-surface-tint active:bg-primary-fixed-dim transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface-container-low" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Technical / Security indicator -->
<div class="mt-8 pt-6 border-t border-outline-variant/50 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest">SECURE 256-BIT ENCRYPTION</span>
</div>
</div>
<!-- Secondary Action / Navigation away from transactional flow -->

<p class="font-body-md text-body-md text-on-surface-variant">
                Deploying a new array?

</p>
